AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Keyless GitLab CI deploys for Brainrotten, plus the private media bucket. GitLab signs in with OIDC (no stored
  AWS keys). The deploy role can only push the runtime image, upload the website, read the media bucket,
  invalidate CloudFront and run CloudFormation on the two Brainrotten stacks; CloudFormation itself uses a
  separate execution role. Third-party media (characters, voices, gameplay, example videos) is never in git:
  it lives in MediaBucket, and scripts/media.mjs pulls it for local work and CI builds.

Parameters:
  GitLabProjectPath:
    Type: String
    Default: wdipak/brainrotten
    AllowedPattern: '^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$'
    Description: GitLab project path; only pipelines on its protected main branch can deploy.
  ApiStackName:
    Type: String
    Default: brainrotten-api
  SiteStackName:
    Type: String
    Default: brainrotten-site
  RuntimeRepositoryName:
    Type: String
    Default: brainrotten-runtime

Resources:
  GitLabOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://gitlab.com
      ClientIdList: [sts.amazonaws.com]

  # Private store for media that must not be public in git. Versioned so an overwrite can be undone.
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-media-${AWS::AccountId}
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 90}

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt MediaBucket.Arn, !Sub '${MediaBucket.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}

  # CloudFormation deploys the stacks with this role, so the deploy role never needs IAM or service permissions itself.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Used only by CloudFormation to create and update the Brainrotten stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AdministratorAccess]

  GitLabDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitLab CI pipelines on the protected main branch to deploy Brainrotten.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitLabOidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                gitlab.com:aud: sts.amazonaws.com
                gitlab.com:sub: !Sub project_path:${GitLabProjectPath}:ref_type:branch:ref:main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApiStackName}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SiteStackName}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: ReadStacks
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ValidateTemplate, cloudformation:ListStacks]
                Resource: '*'
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals: {iam:PassedToService: cloudformation.amazonaws.com}
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
                  - !Sub arn:aws:s3:::${SiteStackName}-sitebucket-*
                  - !Sub arn:aws:s3:::${SiteStackName}-sitebucket-*/*
              - Sid: ReadMedia
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt MediaBucket.Arn, !Sub '${MediaBucket.Arn}/*']
              - Sid: RuntimeImagePush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RuntimeRepositoryName}
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: CodeOnlyDeploys
                Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiStackName}-*
              - Sid: SiteCache
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN CI/CD variable.
    Value: !GetAtt GitLabDeployRole.Arn
  MediaBucketName:
    Description: Private media store; set as the MEDIA_BUCKET CI/CD variable.
    Value: !Ref MediaBucket
  CloudFormationExecutionRoleArn:
    Description: Set as the CFN_EXECUTION_ROLE_ARN CI/CD variable.
    Value: !GetAtt CloudFormationExecutionRole.Arn
