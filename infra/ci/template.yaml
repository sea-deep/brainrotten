AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Keyless GitHub Actions deploys for Brainrotten. GitHub signs in with OIDC (no stored AWS keys).
  The GitHub role can only push the runtime image, upload the website, invalidate CloudFront and run
  CloudFormation on the two Brainrotten stacks; CloudFormation itself uses a separate execution role.

Parameters:
  GitHubSubjectPrefix:
    Type: String
    Default: repo:sea-deep/brainrotten
    AllowedPattern: '^repo:[A-Za-z0-9_.@-]+/[A-Za-z0-9_.@-]+$'
    Description: >-
      Start of the OIDC sub claim. Repos using GitHub's immutable subjects send repo:OWNER@ID/REPO@ID
      (read it from GET repos/OWNER/REPO/actions/oidc/customization/sub, field sub_claim_prefix).
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false if this account already has the token.actions.githubusercontent.com provider.
  ApiStackName:
    Type: String
    Default: brainrotten-api
  SiteStackName:
    Type: String
    Default: brainrotten-site
  RuntimeRepositoryName:
    Type: String
    Default: brainrotten-runtime

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # CloudFormation deploys the stacks with this role, so the GitHub role never needs IAM or service permissions itself.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Used only by CloudFormation to create and update the Brainrotten stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AdministratorAccess]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions (main branch and the site/backend environments) to deploy Brainrotten.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidc
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub ${GitHubSubjectPrefix}:ref:refs/heads/main
                  - !Sub ${GitHubSubjectPrefix}:environment:site
                  - !Sub ${GitHubSubjectPrefix}:environment:backend
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApiStackName}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SiteStackName}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: ReadStacks
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ValidateTemplate, cloudformation:ListStacks]
                Resource: '*'
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals: {iam:PassedToService: cloudformation.amazonaws.com}
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
                  - !Sub arn:aws:s3:::${SiteStackName}-sitebucket-*
                  - !Sub arn:aws:s3:::${SiteStackName}-sitebucket-*/*
              - Sid: RuntimeImagePush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RuntimeRepositoryName}
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: CodeOnlyDeploys
                Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiStackName}-*
              - Sid: SiteCache
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN repository variable.
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Set as the CFN_EXECUTION_ROLE_ARN repository variable.
    Value: !GetAtt CloudFormationExecutionRole.Arn
