name: Deploy backend

# The approval step for the backend: run this from Actions → Deploy backend → Run workflow.
# It reuses the image CI built for this commit (or builds it), deploys the API stack and smoke-tests it.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API and worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: backend
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_STACK: ${{ vars.API_STACK }}
      SITE_STACK: ${{ vars.SITE_STACK }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      CFN_EXECUTION_ROLE_ARN: ${{ vars.CFN_EXECUTION_ROLE_ARN }}
      COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_OAUTH_SECRET_ARN: ${{ vars.GOOGLE_OAUTH_SECRET_ARN }}
      PROVIDER_SECRET_ARN: ${{ vars.PROVIDER_SECRET_ARN }}
      ENABLE_HOSTED_TRIAL: ${{ vars.ENABLE_HOSTED_TRIAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - name: Runtime image for this commit
        id: image
        run: echo "uri=$(scripts/ci/build-runtime-image.sh | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Deploy and smoke-test
        run: scripts/ci/deploy-backend.sh "${{ steps.image.outputs.uri }}" | tee -a "$GITHUB_STEP_SUMMARY"
